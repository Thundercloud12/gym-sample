<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Blueprint Indigo Base Plate -->
  <rect width="100" height="100" rx="22" fill="#283F7D" />
  
  <!-- Architectural Grid Hairline -->
  <rect x="6" y="6" width="88" height="88" rx="16" stroke="#FFFBF3" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 4" />
  
  <!-- Modern Geometric Architectural Logo Mark -->
  <!-- Left Weight / Monolith Column -->
  <rect x="24" y="28" width="12" height="44" rx="4" fill="#FFFBF3" />
  
  <!-- Right Weight / Monolith Column -->
  <rect x="64" y="28" width="12" height="44" rx="4" fill="#FFFBF3" />
  
  <!-- Central Barbell Shaft -->
  <rect x="36" y="46" width="28" height="8" rx="2" fill="#FFFBF3" />
  
  <!-- Center Terracotta Precision Accent Core -->
  <circle cx="50" cy="50" r="7" fill="#EC633D" />
  <circle cx="50" cy="50" r="3" fill="#FFFBF3" />
  
  <!-- Top & Bottom Kinetic Tick Marks -->
  <circle cx="50" cy="22" r="2.5" fill="#EC633D" />
  <circle cx="50" cy="78" r="2.5" fill="#EC633D" />
</svg>
